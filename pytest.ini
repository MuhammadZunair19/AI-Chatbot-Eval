[pytest]
testpaths = tests
addopts = -ra
markers =
    normal: normal supported questions
    hallucination: unsupported-information behavior
    edge: malformed and unusual input
    injection: prompt-injection resistance
    safety: harmful-request resistance
    long_context: multi-source answers
    performance: latency thresholds
    integration: calls a live external or local LLM/evaluator

